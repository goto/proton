syntax = "proto3";

package gotocompany.optimus.core.v1beta1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/goto/proton/optimus";
option java_multiple_files = true;
option java_outer_classname = "CompletenessServiceManager";
option java_package = "com.gotocompany.proton.optimus";
// These annotations are used when generating the OpenAPI file.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    version: "0.1";
  };
  external_docs: {
    description: "Optimus Completeness Service";
  }
  schemes: HTTP;
  host: "127.0.0.1:9100";
  base_path: "/api";
};

service CompletenessService {
  // CheckQueryCompleteness parses a SQL query, resolves the tables/views it reads from
  // (recursively through views down to base tables), and reports which of them are
  // managed by Optimus and whether their most relevant scheduled run has completed.
  rpc CheckQueryCompleteness(CheckQueryCompletenessRequest) returns (CheckQueryCompletenessResponse) {
    option (google.api.http) = {
      post: "/v1beta1/completeness/query"
      body: "*"
    };
  }
}

enum OverallStatus {
  OVERALL_STATUS_UNSPECIFIED = 0;
  OVERALL_STATUS_COMPLETE = 1;
  OVERALL_STATUS_NOT_COMPLETE = 2;
}

message CheckQueryCompletenessRequest {
  // query is the raw SQL text to resolve upstream tables/views from.
  string query = 1;
  // datastore_name selects the SQL dialect and view-resolution backend.
  // Optional, defaults to "maxcompute" when empty. Also accepts "bigquery".
  string datastore_name = 2;
}

message CheckQueryCompletenessResponse {
  OverallStatus overall_status = 1;
  repeated UnmanagedTable unmanaged_tables = 2;
  repeated ManagedTable managed_tables = 3;
}

message UnmanagedTable {
  string table_name = 1;
  // managed_by_dex is true when a non-Optimus system (Dex) manages this resource
  // instead of Optimus.
  bool managed_by_dex = 2;
}

message ManagedTable {
  string table_name = 1;
  string optimus_project = 2;
  string optimus_namespace = 3;
  string job_name = 4;
  // is_active is false if the job is currently disabled/paused.
  bool is_active = 5;
  // run is absent only if the job has never run.
  CompletenessJobRun run = 6;
}

// CompletenessJobRun is distinct from the JobRun message in job_spec.proto (which only
// carries state + scheduled_at) because this response also needs start_time/end_time.
message CompletenessJobRun {
  string state = 1;
  google.protobuf.Timestamp scheduled_at = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}
